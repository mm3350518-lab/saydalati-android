<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>صيدليتي | My Pharmacy</title>
<meta name="theme-color" content="#087f68"><meta name="description" content="لعبة تعليمية لمحاكاة قرارات الصيدلي وإدارة مخزون الصيدلية.">
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#17302b;--mu:#5d7570;--ac:#0f8b6d;--ok:#1b8a3b;--wa:#c98a00;--no:#c0392b;--bd:#d9e4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b19;--card:#172724;--tx:#e6f1ee;--mu:#93aca6;--ac:#2fc29d;--ok:#4cd07a;--wa:#f0b429;--no:#ff7a6b;--bd:#27403b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;padding-bottom:76px}
.top{position:sticky;top:0;background:var(--ac);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;gap:6px;font-size:13px;z-index:5;flex-wrap:wrap}
.top b{font-size:14px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2,h3{margin:0 0 8px}h2{font-size:18px}h3{font-size:15px}
.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:20px;padding:0 10px;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:11px;margin:8px 0}
.opt:disabled{opacity:.45}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px}
.btn.s{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.g{background:transparent;color:var(--no);border:1px solid var(--no)}
.fb{border-radius:10px;padding:9px;margin:7px 0;font-size:14px;border:1.5px solid var(--bd)}
.fb.best{border-color:var(--ok)}.fb.mid{border-color:var(--wa)}.fb.bad{border-color:var(--no)}
.pick{outline:3px solid var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 2px;font-size:12px}
nav button.on{color:var(--ac);font-weight:700}
nav span{display:block;font-size:20px}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
details{border-top:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;font-weight:600}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:13px}.red{color:var(--no)}
.dl dt{font-weight:700;color:var(--ac);font-size:13px;margin-top:6px}.dl dd{margin:0}

/* My Pharmacy v2 enhancements */
:root{--ac:#087f68}
body{background:radial-gradient(circle at top right,rgba(15,139,109,.08),transparent 35%),var(--bg)}
.card{box-shadow:0 5px 18px rgba(10,50,40,.045);transition:transform .18s ease,box-shadow .18s ease}
.card:focus-within,.card:hover{box-shadow:0 8px 22px rgba(10,50,40,.08)}
.opt{transition:transform .12s ease,border-color .12s ease,background .12s ease}
.opt:active,.btn:active{transform:scale(.985)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
.top{align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.top-tools{display:flex;align-items:center;gap:6px;width:100%;justify-content:flex-end}
.top-tools button{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.13);color:white;border-radius:9px;padding:4px 9px;font-size:12px}
.toast{position:fixed;top:70px;left:12px;right:12px;margin:auto;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;z-index:20;box-shadow:0 8px 24px #0002;display:none}
@media(min-width:600px){main{padding:18px}.card{padding:18px}}

</style>
</head>

D.push(

{id:"salb",n:"سالبيوتامول (Salbutamol)",t:"فنتولين",c:"ناهض بيتا-2 قصير المفعول",u:"تخفيف تشنج القصبات حسب خطة علاج الربو",x:"الحساسية للدواء؛ الحذر في بعض اضطرابات القلب",s:"رجفة، خفقان، عصبية",i:"قد يزداد الخفقان مع أدوية محفزة أخرى؛ يحتاج الاستخدام المتكرر لتقييم طبي",d:"تختلف الجرعة حسب الشكل والعمر وخطة الطبيب؛ اتبع الوصفة والنشرة",cost:5,pr:12},
{id:"lora",n:"لوراتادين (Loratadine)",t:"كلاريتين",c:"مضاد هيستامين H1",u:"أعراض التهاب الأنف التحسسي والشرى",x:"الحساسية للدواء؛ تُراجع الجرعة في أمراض الكبد الشديدة",s:"صداع، تعب، نعاس أحياناً",i:"قد تتداخل بعض الأدوية التي تؤثر في استقلابه",d:"البالغ غالباً 10 ملغ مرة يومياً؛ الأطفال حسب العمر والوزن والنشرة",cost:4,pr:9},
{id:"azith",n:"أزيثروميسين (Azithromycin)",t:"زيثروماكس",c:"مضاد حيوي من الماكروليدات",u:"بعض العدوى البكتيرية بوصفة وبعد تقييم الطبيب",x:"الحساسية للماكروليدات؛ الحذر مع إطالة QT وأمراض الكبد",s:"غثيان، إسهال، ألم بطني",i:"قد يتداخل مع أدوية تطيل QT وبعض مضادات التخثر",d:"الجرعة والمدة حسب نوع العدوى والوصفة؛ لا يُستخدم للعدوى الفيروسية",cost:9,pr:18},
{id:"iron",n:"كبريتات الحديد (Ferrous sulfate)",t:"مستحضرات الحديد",c:"مكمل حديد",u:"علاج نقص الحديد المثبت طبياً",x:"زيادة الحديد بالجسم؛ الحذر في اضطرابات تخزين الحديد",s:"إمساك، غثيان، براز داكن",i:"يقل امتصاصه مع مضادات الحموضة والكالسيوم وبعض المضادات الحيوية؛ افصل حسب النشرة",d:"تُحدد الجرعة بحسب كمية الحديد العنصري والحالة والتحاليل",cost:3,pr:8}
);


C.push(
{l:1,k:"حساسية موسمية",p:"بالغ لديه عطاس وحكة بالأنف خلال موسم الربيع، ولا توجد صعوبة تنفس أو علامات خطرة.",o:[["سيتريزين مع مراجعة النشرة والتنبيه للنعاس","cetir",2,"قد يساعد في أعراض الحساسية؛ يُراعى احتمال النعاس والحالة الصحية."],["أموكسيسيلين","amox",0,"المضاد الحيوي لا يعالج الحساسية."],["وارفارين","warf",0,"مضاد تخثر وليس علاجاً للحساسية."],["ديكلوفيناك","diclo",0,"لا يعالج أعراض الحساسية."]]},
{l:2,k:"نقص الحديد",p:"مراجع لديه تحليل يؤكد نقص الحديد، ويحمل توصية طبية بمكمل حديد، ويسأل عن طريقة الاستخدام.",o:[["شرح الالتزام بالجرعة الموصوفة وفصلها عن بعض الأدوية حسب النشرة","iron",2,"الجرعة تعتمد على الحديد العنصري، وقد يتأثر الامتصاص بالطعام والأدوية."],["مضاعفة الجرعة لتسريع التحسن","iron",0,"زيادة الجرعة دون توجيه قد تسبب أضراراً وتسمماً."],["إيقاف المتابعة والتحاليل","iron",0,"تحتاج الاستجابة ومخازن الحديد إلى متابعة مناسبة."],["أخذها دائماً مع مضاد الحموضة","antac",0,"مضادات الحموضة قد تقلل امتصاص الحديد."]]},
{l:3,k:"استخدام بخاخ الربو",p:"مريض ربو يقول إنه يحتاج بخاخ سالبيوتامول مرات أكثر من المعتاد خلال الأيام الأخيرة.",o:[["تقييم عاجل لشدة الأعراض ومراجعة خطة الربو وعدم الاكتفاء بتكرار البخاخ","salb",2,"زيادة الحاجة إلى بخاخ الإنقاذ قد تشير إلى سوء السيطرة وتستدعي تقييماً طبياً."],["طمأنته بأن زيادة الاستخدام طبيعية دائماً","salb",0,"زيادة الاستخدام ليست أمراً يُتجاهل وقد تشير إلى تفاقم الربو."],["صرف مضاد حيوي دون تقييم","azith",0,"لا توجد معلومات تثبت عدوى بكتيرية."],["نصحه بإيقاف كل علاجات الربو","salb",0,"إيقاف العلاج دون خطة قد يكون خطيراً."]]}
)

var S={m:200,xp:0,rep:50,day:1,n:0,up:0,rev:0,sp:0,ok:0,all:0,st:{},seen:[],cur:null,ord:[],fb:null,tab:"c"};
D.forEach(function(d){S.st[d.id]=[{q:4,e:40}]});S.st.para.unshift({q:2,e:3});
function g(id){return D.filter(function(d){return d.id==id})[0]}
function av(id){return S.st[id].reduce(function(a,b){return a+(b.e>0?b.q:0)},0)}
function sell(id){var b=S.st[id].filter(function(x){return x.e>0&&x.q>0}).sort(function(a,b){return a.e-b.e})[0];if(b){b.q--;return true}return false}
function lv(){return S.xp>=120?3:S.xp>=40?2:1}
function mult(){return 1+S.up*0.2}
function pick(){var p=C.filter(function(c){return c.l<=lv()&&S.seen.indexOf(c)<0});if(!p.length){S.seen=[];p=C.filter(function(c){return c.l<=lv()})}
var hi=p.filter(function(c){return c.l==lv()});if(hi.length&&Math.random()<.6)p=hi;S.cur=p[Math.floor(Math.random()*p.length)];S.seen.push(S.cur);
S.ord=S.cur.o.map(function(_,i){return i}).sort(function(){return Math.random()-.5});S.fb=null}
function ans(i){var c=S.cur,o=c.o[i],s=o[2],d=o[1]?g(o[1]):null,gain=0,msg="";
if(d)sell(d.id);S.all++;
if(s==2){gain=Math.round(((d?d.pr:0)+25)*mult());S.xp+=10;S.rep=Math.min(100,S.rep+4);S.ok++}
else if(s==1){gain=Math.round(((d?d.pr:0)+10)*mult());S.xp+=4;S.rep=Math.min(100,S.rep+1)}
else{S.rep-=10}
S.m+=gain;S.rev+=gain;S.fb={i:i,gain:gain,s:s};beep(s==2);
S.day++;S.st&&D.forEach(function(x){S.st[x.id].forEach(function(b){b.e--})});S.m-=10;S.sp+=10;render()}
function nxt(){pick();render()}
function buy(id){var d=g(id),c=d.cost*5;if(S.m<c){alert("رصيدك لا يكفي");return}S.m-=c;S.sp+=c;S.st[id].push({q:5,e:60});render()}
function toss(id){var l=0;S.st[id]=S.st[id].filter(function(b){if(b.e<=0&&b.q>0){l+=b.q*g(id).cost;return false}return b.q>0||b.e>0});render()}
function upg(){var c=300*(S.up+1);if(S.m<c){alert("تحتاج "+c+" د");return}S.m-=c;S.sp+=c;S.up++;render()}
function tab(t){S.tab=t;render()}
function reset(){if(confirm("إعادة اللعبة من البداية؟ سيتم حذف التقدم المحفوظ.")){localStorage.removeItem(SAVE_KEY);location.reload()}}

var SAVE_KEY="saydalati_save_v2";
var UI_LANG=localStorage.getItem("saydalati_lang")||"ar";
var SOUND_ON=localStorage.getItem("saydalati_sound")==="1";
function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));localStorage.setItem("saydalati_saved_at",new Date().toISOString())}catch(e){}
}
function loadGame(){
  try{var raw=localStorage.getItem(SAVE_KEY);if(!raw)return;var old=JSON.parse(raw);
    if(old&&typeof old.m==="number"&&old.st){S=Object.assign(S,old);D.forEach(function(d){if(!S.st[d.id])S.st[d.id]=[{q:4,e:40}]})}
  }catch(e){}
}
function beep(ok){
  if(!SOUND_ON)return;
  try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var a=new AC(),o=a.createOscillator(),g=a.createGain();
    o.type="sine";o.frequency.value=ok?660:180;g.gain.value=.045;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.stop(a.currentTime+.17);o.onended=function(){a.close()}
  }catch(e){}
}
function toggleSound(){SOUND_ON=!SOUND_ON;localStorage.setItem("saydalati_sound",SOUND_ON?"1":"0");render()}
function toggleLang(){UI_LANG=UI_LANG==="ar"?"en":"ar";localStorage.setItem("saydalati_lang",UI_LANG);document.documentElement.lang=UI_LANG;document.documentElement.dir=UI_LANG==="ar"?"rtl":"ltr";render()}
function toast(msg){var t=document.getElementById("toast");if(t){t.textContent=msg;t.style.display="block";setTimeout(function(){t.style.display="none"},2200)}}
function applyUiLanguage(){
  var nav=document.getElementById("nav");
  if(UI_LANG==="en"){
    var labels={"الحالات":"Cases","الموسوعة":"Drug guide","المخزون":"Inventory","التقدم":"Progress"};
    nav.querySelectorAll("button").forEach(function(b){var sp=b.querySelector("span");var key=b.textContent.trim().replace(sp?sp.textContent:"","").trim();if(labels[key])b.innerHTML=(sp?sp.outerHTML:"")+labels[key]});
    var tops=document.getElementById("top");
    tops.innerHTML=tops.innerHTML.replace("مستوى","Level").replace("سمعة","Reputation").replace("يوم","Day");
    var tools=tops.querySelector(".top-tools");if(tools){tools.querySelector('[data-lang]').textContent="العربية";tools.querySelector('[data-save]').textContent="Saved"}
  }
}

function render(){
var L=lv();document.getElementById("top").innerHTML="<span>💰 <b>"+S.m+"</b></span><span>⭐ مستوى <b>"+L+"</b></span><span>🏥 سمعة <b>"+S.rep+"</b></span><span>📅 يوم <b>"+S.day+"</b></span><div class='top-tools'><button data-lang onclick='toggleLang()'>"+(UI_LANG==="ar"?"English":"العربية")+"</button><button onclick='toggleSound()'>"+(SOUND_ON?"🔊":"🔇")+"</button><button data-save onclick='saveGame();toast(\'تم حفظ التقدم\')'>💾 حفظ</button></div>";
var T=[["c","🩺","الحالات"],["e","📖","الموسوعة"],["i","📦","المخزون"],["p","🏆","التقدم"]];
document.getElementById("nav").innerHTML=T.map(function(t){return "<button class='"+(S.tab==t[0]?"on":"")+"' onclick=\"tab('"+t[0]+"')\"><span>"+t[1]+"</span>"+t[2]+"</button>"}).join("");
var h="";
if(S.rep<=0){h="<div class='card'><h2>أُغلقت الصيدلية 😔</h2><p>انخفضت سمعتك إلى الصفر بسبب قرارات خاطئة. راجع الشروحات وابدأ من جديد.</p><button class='btn' onclick='reset()'>ابدأ من جديد</button></div>"}
else if(S.tab=="c"){if(!S.cur)pick();var c=S.cur;
h="<div class='card'><span class='tag'>مستوى "+c.l+"</span><span class='tag' style='background:var(--mu)'>"+c.k+"</span><p>"+c.p+"</p><div class='mu'>اختر القرار الأنسب للمريض:</div>";
if(!S.fb){S.ord.forEach(function(i){var o=c.o[i],bad=o[1]&&av(o[1])==0;h+="<button class='opt' "+(bad?"disabled":"")+" onclick='ans("+i+")'>"+o[0]+(bad?" <span class='red'>(نفد من المخزون)</span>":"")+"</button>"});h+="<div class='mu'>الحالة تمر يوماً وتُخصم أجرة 10 د. أي خيار يصرف دواء يستهلك من مخزونك.</div>"}
else{var f=S.fb,t=f.s==2?"قرار ممتاز ✅":f.s==1?"قرار مقبول ⚠️":"قرار خاطئ ❌";h+="<h3>"+t+(f.gain?" (+"+f.gain+" د)":" (سمعتك انخفضت)")+"</h3>";
S.ord.forEach(function(i){var o=c.o[i],k=o[2]==2?"best":o[2]==1?"mid":"bad",ic=o[2]==2?"✅":o[2]==1?"⚠️":"❌";h+="<div class='fb "+k+(i==f.i?" pick":"")+"'><b>"+ic+" "+o[0]+(i==f.i?" (اختيارك)":"")+"</b><br>"+o[3]+"</div>"});
h+="<button class='btn' onclick='nxt()'>الحالة التالية</button>"}
h+="</div><p class='mu'>لعبة تعليمية؛ لا تغني عن المراجع الطبية أو قرار الصيدلي والطبيب.</p>"}
else if(S.tab=="e"){h="<input placeholder='ابحث بالاسم العلمي أو التجاري أو التصنيف' oninput='flt(this.value)'>"+D.map(function(d){return "<div class='card dr'><h3>"+d.n+"</h3><div class='mu'>"+d.t+" · "+d.c+"</div><details><summary>التفاصيل</summary><dl class='dl'><dt>الاستعمالات</dt><dd>"+d.u+"</dd><dt>موانع الاستعمال والتحذيرات</dt><dd>"+d.x+"</dd><dt>الآثار الجانبية</dt><dd>"+d.s+"</dd><dt>التداخلات</dt><dd>"+d.i+"</dd><dt>الجرعات المرجعية</dt><dd>"+d.d+"</dd></dl></details></div>"}).join("")}
else if(S.tab=="i"){h="<div class='card'><h3>مخزون الصيدلية</h3><div class='mu'>الشراء 5 وحدات لكل مرة بصلاحية 60 يوماً. الصرف يبدأ بالأقرب انتهاءً.</div>";
D.forEach(function(d){var q=av(d.id),ex=S.st[d.id].filter(function(b){return b.e<=0&&b.q>0}).reduce(function(a,b){return a+b.q},0),nr=S.st[d.id].filter(function(b){return b.e>0&&b.q>0}).sort(function(a,b){return a.e-b.e})[0];
h+="<div class='r'><div><b>"+d.n.split(" (")[0]+"</b><br><span class='mu'>متوفر "+q+(nr?" · ينتهي بعد "+nr.e+" يوم":"")+" · شراء "+d.cost+" / بيع "+d.pr+"</span>"+(ex?"<br><span class='red'>منتهي: "+ex+"</span>":"")+"</div><div>"+(ex?"<button class='btn g s' onclick=\"toss('"+d.id+"')\">إتلاف</button> ":"")+"<button class='btn s' onclick=\"buy('"+d.id+"')\">اشترِ "+d.cost*5+"</button></div></div>"});
h+="</div><div class='card'><h3>تطوير الصيدلية</h3><p class='mu'>المستوى الحالي: "+S.up+" (أرباح الحالات ×"+mult().toFixed(1)+")</p><button class='btn' onclick='upg()'>توسيع وتحديث بـ "+300*(S.up+1)+" د</button></div>"}
else{var pc=Math.min(100,L==3?100:L==2?(S.xp-40)/80*100:S.xp/40*100);h="<div class='card'><h3>تقدمك</h3><div class='bar'><i style='width:"+pc+"%'></i></div><p class='mu'>خبرة "+S.xp+(L<3?" · المستوى التالي عند "+(L==1?40:120):" · أقصى مستوى (حالات متقدمة)")+"</p><div class='r'><span>القرارات الممتازة</span><b>"+S.ok+" / "+S.all+"</b></div><div class='r'><span>الدخل</span><b>"+S.rev+"</b></div><div class='r'><span>المصروفات</span><b>"+S.sp+"</b></div><div class='r'><span>صافي الربح</span><b class='"+(S.rev-S.sp<0?"red":"")+"'>"+(S.rev-S.sp)+"</b></div><div class='r'><span>مستوى تطوير الصيدلية</span><b>"+S.up+"</b></div><p class='mu'>المستوى 2 يفتح حالات الأطفال والحساسية، والمستوى 3 يفتح التداخلات والحمل والأمراض المزمنة وعلامات الخطر.</p><button class='btn g' onclick='if(confirm(\"إعادة اللعبة؟\"))reset()'>إعادة اللعبة</button></div>"}
document.getElementById("app").innerHTML=h;saveGame();applyUiLanguage()}
function flt(v){v=v.trim().toLowerCase();document.querySelectorAll(".dr").forEach(function(e){e.style.display=e.textContent.toLowerCase().indexOf(v)>-1?"":"none"})}
loadGame();render();
